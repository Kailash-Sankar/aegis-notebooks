# OpenTelemetry Collector (design §6): receives OTLP from the runner, batches it,
# and exposes a Prometheus endpoint for verification/Grafana. The collector is
# the seam: swapping in SigNoz is an exporter change here, not app code.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Scrape at http://localhost:8889/metrics
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

  # To forward to a self-hosted SigNoz, uncomment (and enable the `signoz`
  # profile in docker-compose.yml):
  # otlp/signoz:
  #   endpoint: signoz-otel-collector:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
