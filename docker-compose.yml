# Local development stack: PocketBase (registry) + RustFS (recovery set) +
# the runner (which also hosts the Pi agent, per ADR 0003).
#
#   docker compose up -d pocketbase rustfs   # registry + backup store only
#   docker compose up --build                 # include the runner
#
# After PocketBase starts, create the superuser once (see README). Note the
# explicit --dir; the CLI default differs from the server's data dir:
#   docker compose exec pocketbase /usr/local/bin/pocketbase superuser upsert \
#     admin@aegis.local aegis-dev-password --dir=/pb/pb_data
services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    command: serve --http=0.0.0.0:8090 --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: aegis
      RUSTFS_SECRET_KEY: aegis-dev-secret
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  # Redpanda: single-node Kafka API (no ZooKeeper). Transport for ingestion.
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:9092
    ports:
      - "9092:9092"   # host clients (127.0.0.1:9092)
      - "9644:9644"   # admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ClickHouse: the OLAP warehouse (Phase 2+). HTTP on 8123; native is mapped to
  # 9111 on the host to avoid RustFS's 9000.
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9111:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: aegis
      CLICKHOUSE_USER: aegis
      CLICKHOUSE_PASSWORD: aegis-dev-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Inngest dev server: the control plane. Inert until the runner serves
  # /api/inngest (Phase 1, slice 4).
  inngest:
    image: inngest/inngest:latest
    # Sync after the runner is up so the function registry is registered before
    # any events are sent.
    depends_on:
      runner:
        condition: service_started
    command: ["inngest", "dev", "-u", "http://runner:8787/api/inngest"]
    ports:
      - "8288:8288"

  # Mocked OLTP source: the external system the ingestion pipeline pulls from
  # (dev/simulation only).
  mock-source:
    build:
      context: .
      dockerfile: mock-source/Dockerfile
    environment:
      MOCK_PORT: "8099"
      # Bind all interfaces so the runner (another container) can reach it.
      MOCK_HOST: 0.0.0.0
      MOCK_DB: /data/mock.db
      MOCK_GENERATE: "1"
      MOCK_INTERVAL_MS: "1500"
      MOCK_LATE_PERCENT: "0.15"
      # Adds a column after N ticks to exercise schema drift / re-onboarding.
      MOCK_DRIFT_AFTER_TICKS: "0"
    volumes:
      - mock_data:/data
    ports:
      - "8099:8099"

  # Create the ingestion topics with the partition counts from the design
  # (keyed by workspace_id: ordering per workspace, parallelism up to N).
  # Idempotent: creates missing topics, and tops up partitions if short.
  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        add_topic() {
          t="$$1"; want="$$2";
          have=$$(rpk topic list 2>/dev/null | awk -v t="$$t" '$$1==t {print $$2}');
          if [ -z "$$have" ] || [ "$$have" = "0" ]; then
            rpk topic create "$$t" -p "$$want" -r 1;
          elif [ "$$have" -lt "$$want" ]; then
            rpk topic add-partitions "$$t" -n $$((want - have));
          fi
        }
        add_topic ingest.chunks 6
        add_topic ingest.dlq 3
        add_topic warehouse.events 6
        rpk topic list
    environment:
      RPK_BROKERS: redpanda:29092

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    depends_on:
      pocketbase:
        condition: service_started
      rustfs:
        condition: service_started
      redpanda:
        condition: service_started
      clickhouse:
        condition: service_started
      mock-source:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    # ADR 0003 hardening: the container is the security boundary.
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    environment:
      # HOME on tmpfs so Pi's runtime writes stay ephemeral and off the
      # read-only root filesystem (we use in-memory sessions).
      HOME: /tmp
      PORT: 8787
      WORKSPACES_ROOT: /workspaces
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: aegis
      RUSTFS_SECRET_KEY: aegis-dev-secret
      RUSTFS_BUCKET: aegis-backups
      RUSTFS_RAW_BUCKET: aegis-raw
      KAFKA_BROKERS: redpanda:29092
      KAFKA_CLIENT_ID: aegis-runner
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: aegis
      CLICKHOUSE_USER: aegis
      CLICKHOUSE_PASSWORD: aegis-dev-password
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_DEV: "1"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      # Model: set OPENROUTER_API_KEY (and optionally AEGIS_MODEL/AEGIS_THINKING)
      # in a .env next to this file, or export them before `docker compose up`.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AEGIS_MODEL: ${AEGIS_MODEL:-}
      AEGIS_THINKING: ${AEGIS_THINKING:-medium}
    volumes:
      - ./workspaces:/workspaces
    ports:
      - "8787:8787"

volumes:
  pb_data:
  rustfs_data:
  redpanda_data:
  clickhouse_data:
  mock_data:
